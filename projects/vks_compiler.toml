# Project Record: VKS-LLVM Compiler

references = [
  "./taxonomy/languages.toml",
  "./taxonomy/frameworks_and_tools.toml"
]

reference_urls = [
  "https://raw.githubusercontent.com/vinayakgupta29/llvm-compiler/refs/heads/monorepo/README.md",
  "https://raw.githubusercontent.com/vinayakgupta29/llvm-compiler/refs/heads/monorepo/rules.md",
