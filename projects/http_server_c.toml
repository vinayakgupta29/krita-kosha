[project.readme_summary]
overview = "A minimalist, zero-dependency HTTP server written in C using low-level POSIX socket APIs. Developed without AI generation or external libraries to master raw socket lifecycle, buffer management, and concurrency models as the prototype networking subsystem for the VKS compiler language standard library."
key_components = [
  "Raw POSIX socket lifecycle: socket(), bind(), listen(), accept(), and non-blocking I/O multiplexing",
  "Zero-allocation HTTP request header parsing and method routing",
  "Static asset streaming with content-type resolution and status code dispatch",
  "Strict memory management with zero memory leaks verified through valgrind"
]

bullets = [
  "Engineered a zero-dependency HTTP/1.1 server in C using raw POSIX socket APIs, managing low-level TCP connection lifecycles and non-blocking socket I/O.",
  "Constructed custom HTTP request header parsing and stream buffering routines, serving as the foundational prototype for the VKS compiler's native networking standard library."
]
