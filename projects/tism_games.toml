[project.readme_summary]
overview = "A collection of 2D desktop arcade games engineered in C++ using the Simple and Fast Multimedia Library (SFML). Implements custom 2D coordinate-transformation models, deterministic 60 FPS tick rates, sprite batching, and low-latency event polling."
key_components = [
  "C++ game loop engine decoupling rendering from game-state updates to guarantee deterministic 60 FPS execution",
  "Screen-to-world pixel coordinate mapping for spatial hitboxes and mouse click collision detection",
  "Kinematic trajectory calculations for particle effects and moving projectile entities",
  "POSIX Linux native compilation with zero external runtime wrappers"
]

bullets = [
  "Engineered a collection of 2D arcade games in C++ using SFML (including SFML Smashers and SFML Velocity), implementing deterministic 60 FPS game loops and spatial collision detection.",
  "Constructed real-time coordinate-transformation and bounding-box hit registration routines, compiling natively for Linux POSIX environments."
]
