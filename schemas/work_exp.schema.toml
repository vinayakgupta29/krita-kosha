# Work Experience Schema Definition & Required Fields Checklist

[index_entry]
description = "Summary record in work_exp/index.toml"
required_fields = [
  "id",                 # string: unique snake_case company/role ID (e.g. 'techasoft')
  "company_name",       # string: legal or trade name of company
  "location",           # string: city, country or 'Remote'
  "start_date",         # string: 'YYYY-MM' (e.g. '2026-03')
  "end_date",           # string: 'YYYY-MM' or 'present'
  "is_current",         # boolean: true if currently employed
  "work_mode",          # string: 'in-office', 'remote', or 'hybrid'
  "roles",              # array of strings: titles held at company
  "tags",               # array of strings: domain/stack tags
  "path"                # string: relative path (e.g. './work_exp/techasoft.toml')
]

[child_file]
description = "Complete work experience record in work_exp/<id>.toml"
required_fields = [
  "references",         # array of strings: relative taxonomy paths
  "experience.id",
  "experience.company",
  "experience.role",
  "experience.location",
  "experience.start_date",
  "experience.end_date",
  "experience.is_current",
  "experience.work_mode",
  "experience.technologies", # array of strings: canonical taxonomy IDs
  "experience.bullets",      # array of strings: [Action Verb] + [Tool] + [Problem] + [Metric]
  "experience.keywords"      # array of strings
]
